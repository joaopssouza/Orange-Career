name: Monitor jobs

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run monitor
        env:
          ATS_URL_TEMPLATE: ${{ secrets.ATS_URL_TEMPLATE }}
          # Prefer the raw JSON secret `GOOGLE_CREDENTIALS` (recommended).
          # For compatibility, keep `GOOGLE_CREDENTIALS_BASE64` as an alternative.
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_CREDENTIALS_BASE64: ${{ secrets.GOOGLE_CREDENTIALS_BASE64 }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEATALK_WEBHOOK_URL: ${{ secrets.SEATALK_WEBHOOK_URL }}
          SEATALK_WEBHOOK_SIGNATURE: ${{ secrets.SEATALK_WEBHOOK_SIGNATURE }}
          SEATALK_BOT_NAME: ${{ secrets.SEATALK_BOT_NAME }}
        run: python main.py
